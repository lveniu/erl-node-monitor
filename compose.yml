name: erlang-monitor

services:
  erlang-exporter:
    build:
      context: .
      target: exporter
    restart: unless-stopped
    command: ["-config", "/etc/erlang-monitor/servers.yml", "-listen", ":20903", "-status-file", "/var/lib/erlang-monitor/exporter-status.json", "-dingtalk-status-file", "/var/lib/erlang-monitor/dingtalk-status.json"]
    environment:
      DINGTALK_WEBHOOK_URL_FILE: /run/secrets/dingtalk_webhook_url
      DINGTALK_SECRET_FILE: /run/secrets/dingtalk_secret
      TZ: Asia/Shanghai
    volumes:
      - ./config/servers.yml:/etc/erlang-monitor/servers.yml:ro
      - exporter-data:/var/lib/erlang-monitor
    secrets:
      - monitor_private_key
      - monitor_private_key_passphrase
      - dingtalk_webhook_url
      - dingtalk_secret
    ports:
      - "127.0.0.1:20903:20903"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:20903/healthz"]
      interval: 1m
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=:20901
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${MONITOR_BIND_IP:-127.0.0.1}:20901:20901"
    depends_on:
      erlang-exporter:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--web.listen-address=:20902"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${MONITOR_BIND_IP:-127.0.0.1}:20902:20902"
    depends_on:
      erlang-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_HTTP_PORT: "20900"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DATAPROXY_SEND_USER_HEADER: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: erlang-monitor-controls-app
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      TZ: Asia/Shanghai
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/dashboards-internal:/var/lib/grafana/dashboards-internal:ro
      - ./grafana/dashboards-qt05-internal:/var/lib/grafana/dashboards-qt05-internal:ro
      - ./grafana/dashboards-qt07-internal:/var/lib/grafana/dashboards-qt07-internal:ro
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MONITOR_BIND_IP:-127.0.0.1}:20900:20900"
    depends_on:
      prometheus:
        condition: service_started

secrets:
  monitor_private_key:
    file: ./secrets/monitor_private_key
  monitor_private_key_passphrase:
    file: ./secrets/monitor_private_key_passphrase
  dingtalk_webhook_url:
    file: ./secrets/dingtalk_webhook_url
  dingtalk_secret:
    file: ./secrets/dingtalk_secret
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
volumes:
  exporter-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
