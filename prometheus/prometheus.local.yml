global:
  scrape_interval: 1m
  evaluation_interval: 1m
  external_labels:
    monitor_cluster: erlang-monitor-local

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:20902]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:20901]

  - job_name: erlang-exporter
    static_configs:
      - targets: [127.0.0.1:20903]
