# Copy this file to the Git-ignored holmes/model_list.local.yaml. The model IDs
# are deployment values and must be replaced only after checking the provider's
# current account model list. Do not add actual API keys to this file.
glm:
  model: openai/REPLACE_WITH_ACCOUNT_GLM_MODEL_ID
  api_base: https://open.bigmodel.cn/api/paas/v4
  api_key: "{{ env.GLM_API_KEY }}"

kimi:
  model: openai/REPLACE_WITH_ACCOUNT_KIMI_MODEL_ID
  api_base: https://api.moonshot.cn/v1
  api_key: "{{ env.KIMI_API_KEY }}"
  # Kimi K3 intentionally has no explicit temperature.
