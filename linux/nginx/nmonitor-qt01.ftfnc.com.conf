server {
    listen 80;
    server_name nmonitor-qt01.ftfnc.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nmonitor-qt01.ftfnc.com;

    ssl_certificate /data/conf/nginx/cert/ftfnc.com.crt;
    ssl_certificate_key /data/conf/nginx/cert/ftfnc.com.key;

    # Ops Agent uses one plugin-proxy endpoint for regular JSON requests and
    # long-lived SSE. Disable buffering here so every flushed event reaches
    # the browser immediately through the HTTPS reverse proxy.
    location = /api/plugin-proxy/erlang-monitor-controls-app/ops-agent {
        proxy_pass http://127.0.0.1:20900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 10m;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://127.0.0.1:20900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
