global:
  resolve_timeout: 5m

route:
  receiver: dingtalk
  group_by: [alertname, severity, server, node]
  group_wait: 15s
  group_interval: 5m
  # 同一告警在恢复前只通知一次；恢复后再次触发会作为新事件发送。
  repeat_interval: 8760h
  routes:
    # Run Queue告警仅保留在Prometheus/Alertmanager/Grafana，不推送钉钉。
    - receiver: discard
      matchers:
        - 'alertname="ErlangRunQueueSustainedHigh"'
    # qt-01/qt-05 及后续同命名内网服务器仍发告警，但不 @ 人。
    - receiver: dingtalk-no-mention
      matchers:
        - 'server=~"qt[0-9]+-internal-.*"'

receivers:
  - name: discard
  - name: dingtalk
    webhook_configs:
      - url: http://127.0.0.1:20903/alertmanager
        send_resolved: true
        max_alerts: 20
  - name: dingtalk-no-mention
    webhook_configs:
      - url: "http://127.0.0.1:20903/alertmanager?mention=false"
        send_resolved: true
        max_alerts: 20
