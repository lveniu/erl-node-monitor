[server]
protocol = http
http_addr = 127.0.0.1
http_port = 20900

[security]
admin_user = admin

[users]
allow_sign_up = false
default_language = zh-Hans

[auth.anonymous]
enabled = true
org_role = Viewer

[dataproxy]
send_user_header = true

[plugins]
allow_loading_unsigned_plugins = erlang-monitor-controls-app
preinstall_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
