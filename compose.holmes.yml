# Optional Holmes overlay. The base compose.yml starts the existing monitoring
# stack without Holmes secrets or dependencies. Enable this overlay only after
# creating the ignored Secret files and model_list.local.yaml:
# docker compose -f compose.yml -f compose.holmes.yml --profile holmes up -d
services:
  grafana:
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export HOLMES_TOOL_API_TOKEN="$$(cat /run/secrets/holmes_tool_api_token)";
        exec /run.sh
    secrets:
      - grafana_admin_password
      - holmes_tool_api_token

secrets:
  holmes_tool_api_token:
    file: ./secrets/holmes_tool_api_token
