# Bounded HolmesGPT configuration for the native Linux service.
max_steps: 20
custom_skill_paths:
  - /data/node_monitor/holmes/skills

toolsets:
  prometheus/metrics:
    enabled: true
    subtype: prometheus
    config:
      prometheus_url: http://127.0.0.1:20901
      tool_calls_return_data: true
